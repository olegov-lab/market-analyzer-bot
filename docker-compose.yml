x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: btcbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/postgresql.conf:/etc/postgresql/custom.conf:ro
    command: postgres -c config_file=/etc/postgresql/custom.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    oom_score_adj: -250
    mem_limit: 1024M
    mem_reservation: 512M
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    oom_score_adj: -250
    mem_limit: 64M
    mem_reservation: 32M
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  collector:
    build: .
    command: python -m btcbot.collector
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/btcbot"
      REDIS_URL: "redis://redis:6379/0"
      DB_POOL_MIN: 1
      DB_POOL_MAX: 2
      SEED_HISTORY: "1"
      PYTHONUNBUFFERED: 1
    volumes:
      - ./btcbot:/app/btcbot
    restart: unless-stopped
    oom_score_adj: 100
    mem_limit: 128M
    mem_reservation: 64M
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  scheduler:
    build: .
    command: python -m btcbot.scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/btcbot"
      REDIS_URL: "redis://redis:6379/0"
      DB_POOL_MIN: 1
      DB_POOL_MAX: 2
      TZ: Europe/Moscow
    volumes:
      - model_data:/app/models
      - ./btcbot:/app/btcbot
    restart: unless-stopped
    oom_score_adj: 100
    mem_limit: 256M
    mem_reservation: 128M
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000 --workers 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/btcbot
      REDIS_URL: redis://redis:6379/0
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      PYTHONUNBUFFERED: 1
    volumes:
      - model_data:/app/models
      - ./miniapp:/app/miniapp
      - ./backend:/app/backend
      - ./btcbot:/app/btcbot
      - ./bot:/app/bot
    restart: unless-stopped
    oom_score_adj: 100
    mem_limit: 256M
    mem_reservation: 128M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  bot:
    build: .
    command: python -m bot.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/btcbot
      REDIS_URL: redis://redis:6379/0
      DB_POOL_MIN: 1
      DB_POOL_MAX: 5
      PYTHONUNBUFFERED: 1
      TZ: Europe/Moscow
    volumes:
      - model_data:/app/models
      - ./btcbot:/app/btcbot
      - ./bot:/app/bot
      - ./backend:/app/backend
    restart: unless-stopped
    oom_score_adj: 100
    mem_limit: 256M
    mem_reservation: 128M
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  pgdata:
  model_data:
