<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000">
<title>BTC Monitor</title>
<base href="/miniapp/">
<link rel="stylesheet" href="app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="app">
  <main id="content">
    <div class="loading" id="loading-screen">
      <div class="spinner"></div>
      <p id="loading-text">Загрузка...</p>
    </div>
  </main>
  <nav id="orbital-nav">
    <button class="orbital-btn active" data-page="indicators" style="bottom:33px;left:calc(50% - 140px)"><span class="orbital-icon">📊</span><span class="orbital-label">Индик.</span></button>
    <button class="orbital-btn" data-page="miniapp" style="bottom:33px;left:calc(50% - 80px)"><span class="orbital-icon">🎮</span><span class="orbital-label">Мини App</span></button>
    <button id="ai-bubble" title="AI Чат" style="bottom:19px;left:50%"><span>🧠</span></button>
    <button class="orbital-btn" data-page="news" style="bottom:33px;left:calc(50% + 80px)"><span class="orbital-icon">📰</span><span class="orbital-label">Новости</span></button>
    <button class="orbital-btn" data-page="upgrade" style="bottom:33px;left:calc(50% + 140px)"><span class="orbital-icon">💎</span><span class="orbital-label">PRO</span></button>
  </nav>
</div>
<script src="app.js?v=20260512"></script>
</body>
</html>
