x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: btcbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    oom_score_adj: -500
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    oom_score_adj: -250
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  collector:
    build: .
    command: python -m btcbot.collector
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/btcbot"
      REDIS_URL: "redis://redis:6379/0"
      SEED_HISTORY: "1"
      PYTHONUNBUFFERED: 1
    volumes:
      - ./btcbot:/app/btcbot
    restart: unless-stopped
    oom_score_adj: 100
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  scheduler:
    build: .
    command: python -m btcbot.scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/btcbot"
      REDIS_URL: "redis://redis:6379/0"
      TZ: Europe/Moscow
    volumes:
      - model_data:/app/models
      - ./btcbot:/app/btcbot
    restart: unless-stopped
    oom_score_adj: 100
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M

  api:
    build: .
    network_mode: host
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/btcbot
      REDIS_URL: redis://localhost:6379/0
      PYTHONUNBUFFERED: 1
    volumes:
      - model_data:/app/models
      - ./miniapp:/app/miniapp
      - ./backend:/app/backend
      - ./btcbot:/app/btcbot
    restart: unless-stopped
    oom_score_adj: 100
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  bot:
    build: .
    network_mode: host
    command: python -m bot.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/btcbot
      REDIS_URL: redis://localhost:6379/0
      PYTHONUNBUFFERED: 1
      TZ: Europe/Moscow
    volumes:
      - model_data:/app/models
      - ./btcbot:/app/btcbot
      - ./bot:/app/bot
      - ./backend:/app/backend
    restart: unless-stopped
    oom_score_adj: 100
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M

volumes:
  pgdata:
  model_data:
